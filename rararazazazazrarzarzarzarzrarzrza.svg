<feMergeNode in="b"/>
<feMergeNode in="b"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<linearGradient id="c">
<stop stop-color="#00ffff"/>
<stop offset=".5" stop-color="#008cff"/>
<stop offset="1" stop-color="#003cff"/>
</linearGradient>

</defs>

<rect width="1200" height="700" fill="#000"/>

