<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">

<defs>

<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
<feGaussianBlur stdDeviation="6" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<filter id="softGlow" x="-150%" y="-150%" width="400%" height="400%">
<feGaussianBlur stdDeviation="13" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#8fffff"/>
<stop offset=".35" stop-color="#00d9ff"/>
<stop offset=".7" stop-color="#0077ff"/>
<stop offset="1" stop-color="#003cff"/>
</linearGradient>

<radialGradient id="orb">
<stop stop-color="#ffffff"/>
<stop offset=".15" stop-color="#00ffff"/>
<stop offset=".55" stop-color="#008cff"/>
<stop offset="1" stop-color="#003cff"/>
</radialGradient>

</defs>

<rect width="1200" height="700" fill="#000"/>

