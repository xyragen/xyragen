<svg xmlns="http://www.w3.org/2000/svg"
     width="760"
     height="430"
     viewBox="0 0 760 430">

  <style>
    :root {
      --bg: #0d1117;
      --panel: #111820;
      --text: #d7dde5;
      --green: #7ee787;
      --red: #ff7b72;
      --border: #27313c;
    }

    .terminal {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: 2;
    }

    .prompt,
    .command,
    .error {
      font-family: monospace;
      font-size: 20px;
      dominant-baseline: hanging;
    }

    .prompt {
      fill: var(--green);
    }

    .command {
      fill: var(--text);
    }

    .error {
      fill: var(--red);
    }

    .cursor {
      fill: var(--text);
    }

    .blink {
      animation: blink 0.9s steps(1) infinite;
    }

    /* First command */
    #cmd1 {
      clip-path: inset(0 100% 0 0);
      animation:
        type1 2s steps(9) 0.8s forwards,
        erase1 0.8s steps(9) 5.2s forwards;
    }

    #cursor1 {
      animation: cursor1 6s steps(1) forwards;
    }

    /* Error message */
    #error {
      opacity: 0;
      animation:
        errorIn 0.1s 3.9s forwards,
        errorOut 0.2s 6.3s forwards;
    }

    /* Second command */
    #cmd2 {
      clip-path: inset(0 100% 0 0);
      animation:
        type2 2.8s steps(13) 6.8s forwards,
        erase2 1s steps(13) 11.8s forwards;
    }

    #cursor2 {
      opacity: 0;
      animation: cursor2 13s steps(1) forwards;
    }

    /* Final deletion effect */
    #terminalContent {
      animation: deleteAll 0.7s 12.9s forwards;
    }

    @keyframes type1 {
      to { clip-path: inset(0 0 0 0); }
    }

    @keyframes erase1 {
      from { clip-path: inset(0 0 0 0); }
      to { clip-path: inset(0 100% 0 0); }
    }

    @keyframes type2 {
      to { clip-path: inset(0 0 0 0); }
    }

    @keyframes erase2 {
      from { clip-path: inset(0 0 0 0); }
      to { clip-path: inset(0 100% 0 0); }
    }

    @keyframes errorIn {
      to { opacity: 1; }
    }

    @keyframes errorOut {
      to { opacity: 0; }
    }

    @keyframes cursor1 {
      0%, 65% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }

    @keyframes cursor2 {
      0%, 54% { opacity: 0; }
      55%, 100% { opacity: 1; }
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes deleteAll {
      to {
        opacity: 0;
        transform: scale(0.98);
        transform-origin: center;
      }
    }
  </style>

  <!-- Background -->
  <rect width="760" height="430" fill="#0d1117"/>

  <!-- Minimal arched terminal, no window controls or title bar -->
  <rect
    class="terminal"
    x="30"
    y="30"
    width="700"
    height="370"
    rx="70"
    ry="70"
  />

  <g id="terminalContent">

    <!-- First command -->
    <text class="prompt" x="75" y="145">
      xyragen@archlinux:~$
    </text>

    <text id="cmd1" class="command" x="365" y="145">
      rm -rf /
    </text>

    <rect
      id="cursor1"
      class="cursor blink"
      x="462"
      y="147"
      width="11"
      height="22"
    />

    <!-- Error -->
    <text id="error" class="error" x="75" y="205">
      error: permission denied
    </text>

    <!-- Second command -->
    <text class="prompt" x="75" y="265">
      xyragen@archlinux:~$
    </text>

    <text id="cmd2" class="command" x="365" y="265">
      sudo rm -rf /
    </text>

    <rect
      id="cursor2"
      class="cursor blink"
      x="500"
      y="267"
      width="11"
      height="22"
    />

  </g>
</svg>
