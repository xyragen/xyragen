<svg width="620" height="140" viewBox="0 0 620 140" xmlns="http://www.w3.org/2000/svg">
  <style>
    .base{
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .layer{ fill:#f5f2ff; }
    .pink{ fill:#ff2e88; opacity:0.85; }
    .blue{ fill:#00e0ff; opacity:0.85; }
    .g-pink{ animation: glitchTop 2.6s infinite; }
    .g-blue{ animation: glitchBot 2.6s infinite; }
    @keyframes glitchTop{
      0%, 88%, 100% { transform: translate(0,0); opacity:0; }
      89% { transform: translate(-5px,-3px); opacity:0.85; }
      91% { transform: translate(4px,2px); opacity:0.85; }
      93% { transform: translate(-3px,3px); opacity:0.85; }
      95% { transform: translate(0,0); opacity:0; }
    }
    @keyframes glitchBot{
      0%, 88%, 100% { transform: translate(0,0); opacity:0; }
      89% { transform: translate(5px,3px); opacity:0.85; }
      91% { transform: translate(-4px,-2px); opacity:0.85; }
      93% { transform: translate(3px,-3px); opacity:0.85; }
      95% { transform: translate(0,0); opacity:0; }
    }
  </style>

  <text x="50%" y="80" text-anchor="middle" class="base pink g-pink">hi, i'm xyragen.</text>
  <text x="50%" y="80" text-anchor="middle" class="base blue g-blue">hi, i'm xyragen.</text>
  <text x="50%" y="80" text-anchor="middle" class="base layer">hi, i'm xyragen.</text>
</svg>
